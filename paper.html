<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Qog'oz test variantlari</title>

<style>
body{
    font-family:Arial,sans-serif;
    margin:20px;
}

.variant{
    page-break-after:always;
    margin-bottom:40px;
}

h2{
    text-align:center;
}

.savol{
    margin:12px 0;
}

.variantlar{
    margin-left:20px;
}

.printBtn{
    position:fixed;
    top:10px;
    right:10px;
    background:white;
    border:1px solid #999;
    padding:10px;
    font-size:13px;
    z-index:999;
}

.printBtn button,
.printBtn select,
.printBtn input{
    margin-top:4px;
    padding:4px;
}

.togriJavob{
    font-weight:bold;
}

.togriJavob{
    font-weight:bold;
}


.variant{
    page-break-after:always;
}

.savollarBlok{
    display:flex !important;
    gap:20px;
    margin-top:10px;
    align-items:flex-start;
}

.ustun{
    width:50% !important;
    box-sizing:border-box;
}



.ustun{
    width:50%;
}

.chapUstun{
    border-right:1px solid #000;
    padding-right:15px;
}

.ongUstun{
    padding-left:15px;
}

.savol{
    font-size:11px;
    margin-bottom:5px;
}

.javobJadval{
    width:220px;
    border-collapse:collapse;
    text-align:center;
    margin-top:0px;
    font-size:10px;
    page-break-inside:avoid;
    break-inside:avoid;
}

.javobJadval th,
.javobJadval td{
    border:1px solid #000;
    width:22px;
    height:16px;
}

@media print{
    @page{
        size:A4;
        margin:12mm;
    }

@media print{
    .javobQismi{
        page-break-before:auto;
        page-break-inside:avoid;
    }


@media print{
    .savollarBlok{
        display:flex !important;
        column-count:unset !important;
        column-gap:unset !important;
        column-rule:none !important;
    }
}

    .javobJadval{
        page-break-inside:avoid;
    }
}


    .printBtn{
        display:none;
    }
}

.javobQismi{
    width:280px;
    margin-left:45px;
    margin-top:0;
    break-inside:avoid;
    page-break-inside:avoid;
}



</style>

<script src="papervar/paper_config.js"></script>
<script src="papervar/questions.js"></script>


</head>
<body>

<div class="printBtn">

    <select id="javobRejimi">
        <option value="korinsin">To‘g‘ri javob ko‘rinsin</option>
        <option value="belgilanmasin">To‘g‘ri javob belgilanmasin</option>
        <option value="olibTashlansin">To‘g‘ri javob olib tashlansin</option>
    </select>

    <br><br>

    <label>
        Boshlanish:
        <input type="number" id="startSavol" value="1" min="1" style="width:60px;">
    </label>

    <label>
        Tugash:
        <input type="number" id="endSavol" min="1" style="width:60px;">
    </label>

    <br><br>

    <button onclick="barchaSavollarniChiqar()">
        Savollarni chiqarish
    </button>

    <button onclick="window.print()">
        PDF / Chop etish
    </button>

</div>

<div id="natija"></div>

<script>

function shuffle(arr){
    let a=[...arr];

    for(let i=a.length-1;i>0;i--){
        let j=Math.floor(Math.random()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];
    }

    return a;
}

const VARIANTLAR_SONI = PAPER_CONFIG.variantlarSoni;
const SAVOLLAR_SONI = PAPER_CONFIG.harBirVariantSavolSoni;
window.onload = function(){
    document.getElementById("endSavol").value = SAVOLLAR.length;
    document.getElementById("endSavol").max = SAVOLLAR.length;
};

let html = "";

if(SAVOLLAR_SONI > SAVOLLAR.length){
    alert(
        "Xatolik! Har bir variantdagi savollar soni umumiy savollar sonidan katta bo'lishi mumkin emas."
    );
    throw new Error("Bitta variant uchun savollar yetarli emas");
}

let savolBank = shuffle([...SAVOLLAR]);
let bankIndex = 0;

function variantUchunSavollarOl(soni){
    let tanlangan = [];

    while(tanlangan.length < soni){

        if(bankIndex >= savolBank.length){
            savolBank = shuffle([...SAVOLLAR]);
            bankIndex = 0;
        }

        let savol = savolBank[bankIndex];
        bankIndex++;

        let takrorBor = tanlangan.some(
            s => s.savol === savol.savol
        );

        if(!takrorBor){
            tanlangan.push(savol);
        }
    }

    return tanlangan;
}

let kalitlarHTML = "";
for(let v=1; v<=VARIANTLAR_SONI; v++){
let variantKaliti = [];

let savollar = variantUchunSavollarOl(SAVOLLAR_SONI);

html += `
<div class="variant">

    <h2>
    ${PAPER_CONFIG.sarlavha}
    <br>
    ${v}-VARIANT
    </h2>

<table style="margin-bottom:0px;line-height:1;">
<tr>
    <td>F.I.Sh</td>
    <td style="width:220px;border-bottom:1px solid #000;"></td>
</tr>
<tr>
    <td>Guruh</td>
    <td style="border-bottom:1px solid #000;"></td>
</tr>
</table>
`;

html += `
<div class="javobQismi">

<table class="javobJadval">
`;

for(let start=1; start<=savollar.length; start+=10){

    html += "<tr>";

    for(let k=start;
            k<=Math.min(start+9, savollar.length);
            k++){

        html += `<th>${k}</th>`;
    }

    html += "</tr><tr>";

    for(let k=start;
            k<=Math.min(start+9, savollar.length);
            k++){

        html += `<td>&nbsp;</td>`;
    }

    html += "</tr>";
}

html += `
</table>
</div>
`;


let yarim = Math.ceil(savollar.length / 2);
let chapSavollar = savollar.slice(0, yarim);
let ongSavollar = savollar.slice(yarim);

  html += `
<div class="savollarBlok">
    <div class="ustun chapUstun">
`;

chapSavollar.forEach((s,index)=>{

    let javoblar = shuffle([...s.variantlar]);

    let togriIndex = javoblar.indexOf(s.togri);

    let togriHarf = String.fromCharCode(65 + togriIndex);

    variantKaliti[index] = (index + 1) + "-" + togriHarf;

    html += `
    <div class="savol">
        <b>${index+1}. ${s.savol}</b>

        <div class="variantlar">
    `;

    javoblar.forEach((j,i)=>{
        html += `
        <div>
        ${String.fromCharCode(65+i)}) ${j}
        </div>
        `;
    });

    html += `
        </div>
    </div>
    `;





});

html += `
    </div>

    <div class="ustun ongUstun">
`;

ongSavollar.forEach((s,index)=>{

    let haqiqiyIndex = yarim + index;

    let javoblar = shuffle([...s.variantlar]);

    let togriIndex = javoblar.indexOf(s.togri);

    let togriHarf = String.fromCharCode(65 + togriIndex);

    variantKaliti[haqiqiyIndex] = (haqiqiyIndex + 1) + "-" + togriHarf;

    html += `
    <div class="savol">
        <b>${haqiqiyIndex+1}. ${s.savol}</b>

        <div class="variantlar">
    `;

    javoblar.forEach((j,i)=>{
        html += `
        <div>
        ${String.fromCharCode(65+i)}) ${j}
        </div>
        `;
    });

    html += `
        </div>
    </div>
    `;

});

html += `
    </div>
</div>
`;


kalitlarHTML += `
<h3>${v}-VARIANT JAVOBLAR KALITI</h3>
<p>${variantKaliti.join(" | ")}</p>
`;

    html += `
    </div>
    `;
}

document.getElementById("natija").innerHTML =
    html +
    "<hr><h2>JAVOBLAR KALITI</h2>" +
    kalitlarHTML;


function barchaSavollarniChiqar(){

    let rejim = document.getElementById("javobRejimi").value;

    let start =
        parseInt(document.getElementById("startSavol").value);

    let end =
        parseInt(document.getElementById("endSavol").value);

    if(isNaN(start) || start < 1){
        start = 1;
    }

    if(isNaN(end) || end > SAVOLLAR.length){
        end = SAVOLLAR.length;
    }

    if(start > end){
        alert("Boshlanish raqami tugash raqamidan katta bo‘lmasin!");
        return;
    }

    let tanlanganSavollar =
        SAVOLLAR.slice(start - 1, end);

    let html = `
        <h2>${PAPER_CONFIG.sarlavha}</h2>
        <h2>TEST TOPSHIRIQLARI</h2>
    `;

    tanlanganSavollar.forEach((s, index) => {

        html += `
            <div class="savol">
                <b>${start + index}. ${s.savol}</b>

                <div class="variantlar">
        `;

        let variantlar = [...s.variantlar];

        if(rejim === "olibTashlansin"){
            variantlar = variantlar.filter(j => j !== s.togri);
        }

        variantlar.forEach((j, i) => {

            let harf = String.fromCharCode(65 + i);

            if(rejim === "korinsin" && j === s.togri){
                html += `
                    <div class="togriJavob">
                        ${harf}) ${j}
                    </div>
                `;
            } else {
                html += `
                    <div>
                        ${harf}) ${j}
                    </div>
                `;
            }

        });

        html += `
                </div>
            </div>
        `;
    });

    document.getElementById("natija").innerHTML = html;
}

</script>

</body>
</html>
